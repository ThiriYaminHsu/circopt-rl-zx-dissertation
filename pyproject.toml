[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circopt-adder"
version = "0.1.0"
description = "RL agents for ZX-calculus circuit optimisation (GATv2 actor-critic PPO), ablating random-vs-adder-structured training data"
requires-python = ">=3.10"
dependencies = [
    "pyzx>=0.10.5",
    "torch>=2.0",
    "torch-geometric>=2.5",
    "numpy",
    "gymnasium",
    "matplotlib",
    "seaborn",
    "pandas",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
